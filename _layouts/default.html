<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ '/' | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/profile.png' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@scrubmx">
  <meta name="twitter:title" content="{{ site.title }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <meta name="twitter:image" content="{{ '/assets/images/profile.png' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital@0;1&family=Gabarito&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}" aria-label="Home link">
      <img class="avatar" src="{{ '/assets/images/profile.png' | relative_url }}" alt="{{ site.author }}" width="45" height="45">
    </a>
    <button type="button" id="menu-button" aria-expanded="false" aria-controls="main-menu" aria-label="Menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512" fill="currentColor"><path d="M128 102.4c0-14.138 11.462-25.6 25.6-25.6h332.8c14.138 0 25.6 11.462 25.6 25.6S500.538 128 486.4 128H153.6c-14.138 0-25.6-11.463-25.6-25.6zm358.4 128H25.6C11.462 230.4 0 241.863 0 256c0 14.138 11.462 25.6 25.6 25.6h460.8c14.138 0 25.6-11.462 25.6-25.6 0-14.137-11.462-25.6-25.6-25.6zm0 153.6H256c-14.137 0-25.6 11.462-25.6 25.6 0 14.137 11.463 25.6 25.6 25.6h230.4c14.138 0 25.6-11.463 25.6-25.6 0-14.138-11.462-25.6-25.6-25.6z"/></svg>
    </button>
    <nav id="main-menu" class="hidden">
      <ul>
        <li><a class="nav-item" href="#experience">Experience</a></li>
        <!-- TODO: add <li><a class="nav-item" href="#projects">Projects</a></li> once the Featured Projects section has content (see BLOCKERS.md) -->
        <li><a class="nav-item" href="#about">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <ul>
      <li><a class="external" href="https://twitter.com/scrubmx" target="_blank" rel="noopener">Twitter</a></li>
      <li><a class="external" href="https://www.linkedin.com/in/jorge-gnz" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a class="external" href="https://github.com/scrubmx" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
    <p>© 2026 Jorge González. All rights reserved.</p>
  </footer>

  <script>
    var button = document.getElementById('menu-button');
    var menu = document.getElementById('main-menu');
    var links = menu.querySelectorAll('a');
    function toggleMenu() {
      menu.classList.toggle('hidden');
      button.setAttribute('aria-expanded', String(!menu.classList.contains('hidden')));
    }
    button.addEventListener('click', toggleMenu);
    links.forEach(function (link) { link.addEventListener('click', toggleMenu); });

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        links.forEach(function (link) {
          link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id);
        });
      });
    }, { rootMargin: '-50% 0px -50% 0px' });
    document.querySelectorAll('section').forEach(function (section) { observer.observe(section); });

    // Port of motion-primitives <Tilt rotationFactor={8} isRevese>: the pointer offset from the
    // centre (-0.5..0.5) follows a spring (motion's useSpring defaults: stiffness 100, damping 10,
    // mass 1) and is mapped to rotateX/rotateY, clamped to +/-8deg. Like the library (motion's
    // reducedMotion defaults to "never"), it runs regardless of prefers-reduced-motion.
    var tilt = document.querySelector('.tilt');
    if (tilt) {
      var FACTOR = 8;
      var target = { x: 0, y: 0 }, pos = { x: 0, y: 0 }, vel = { x: 0, y: 0 };
      var last = 0, frame = 0;
      var clamp = function (v) { return Math.max(-0.5, Math.min(0.5, v)); };
      var step = function (now) {
        var dt = Math.max(0, Math.min((now - last) / 1000, 0.064)) / 4;
        var moving = false;
        last = now;
        ['x', 'y'].forEach(function (k) {
          for (var i = 0; i < 4; i++) {
            vel[k] += (-100 * (pos[k] - target[k]) - 10 * vel[k]) * dt;
            pos[k] += vel[k] * dt;
          }
          if (Math.abs(vel[k]) > 0.001 || Math.abs(pos[k] - target[k]) > 0.001) moving = true;
          else { pos[k] = target[k]; vel[k] = 0; }
        });
        tilt.style.transform = 'perspective(1000px) rotateX(' + (-2 * FACTOR * clamp(pos.y)) +
          'deg) rotateY(' + (2 * FACTOR * clamp(pos.x)) + 'deg)';
        frame = moving ? requestAnimationFrame(step) : 0;
      };
      var animate = function () {
        if (!frame) { last = performance.now(); frame = requestAnimationFrame(step); }
      };
      tilt.addEventListener('mousemove', function (e) {
        var rect = tilt.getBoundingClientRect();
        target.x = (e.clientX - rect.left) / rect.width - 0.5;
        target.y = (e.clientY - rect.top) / rect.height - 0.5;
        animate();
      });
      tilt.addEventListener('mouseleave', function () { target.x = 0; target.y = 0; animate(); });
    }
  </script>
</body>
</html>
